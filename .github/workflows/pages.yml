name: Publish to GitHub Pages

# Copies public/ to the gh-pages branch on every push.
# One-time setup in the repo: Settings → Pages → Source: "Deploy from a branch" → gh-pages / (root).
# The site then runs in serverless mode (WebRTC between phones) — no Node server needed.
on:
  push:
    branches: [claude/swords-palm-dashboard-5xec6v, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Cache-bust every script/style so phones never mix an old app.js with a new index.html.
      - name: Stamp asset URLs with the commit
        run: |
          V=${GITHUB_SHA::8}
          sed -i "s#\"style.css\"#\"style.css?v=$V\"#; s#\"game-core.js\"#\"game-core.js?v=$V\"#; s#\"app.js\"#\"app.js?v=$V\"#" public/index.html
          sed -i "s#'./net.js'#'./net.js?v=$V'#" public/app.js
          grep -c "v=$V" public/index.html public/app.js
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true
          commit_message: "Publish site"
