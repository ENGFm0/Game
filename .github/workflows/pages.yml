name: Build & publish to GitHub Pages

# Builds the client and copies dist/ to the gh-pages branch on every push.
# One-time: Settings → Pages → Source "Deploy from a branch" → gh-pages / (root).
# On Pages the game runs serverless (host phone + WebRTC); with server.js it uses Socket.io.
on:
  push:
    branches: [claude/swords-palm-dashboard-5xec6v, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          commit_message: "Publish site"
